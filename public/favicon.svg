        font-family="system-ui,-apple-system,'Helvetica Neue',sans-serif"
        font-weight="900" font-size="26" fill="#ff3232" opacity="0.8"
        text-anchor="middle">S</text>
  <!-- Blue channel: shifted right -->
  <text x="18.5" y="25"
        font-family="system-ui,-apple-system,'Helvetica Neue',sans-serif"
        font-weight="900" font-size="26" fill="#3264ff" opacity="0.8"
