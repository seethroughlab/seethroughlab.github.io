<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#000"/>
  <!-- Outer red: far left -->
  <text x="9"  y="25" font-family="system-ui,-apple-system,'Helvetica Neue',sans-serif"
        font-weight="900" font-size="22" fill="none" stroke="#ff0000" stroke-width="1.5"
        text-anchor="middle">S</text>
  <!-- Yellow: left -->
  <text x="12" y="25" font-family="system-ui,-apple-system,'Helvetica Neue',sans-serif"
        font-weight="900" font-size="22" fill="none" stroke="#ffff00" stroke-width="1.5"
        text-anchor="middle">S</text>
  <!-- Cyan: right -->
  <text x="20" y="25" font-family="system-ui,-apple-system,'Helvetica Neue',sans-serif"
        font-weight="900" font-size="22" fill="none" stroke="#00ffff" stroke-width="1.5"
        text-anchor="middle">S</text>
  <!-- Blue: far right -->
  <text x="23" y="25" font-family="system-ui,-apple-system,'Helvetica Neue',sans-serif"
        font-weight="900" font-size="22" fill="none" stroke="#0000ff" stroke-width="1.5"
        text-anchor="middle">S</text>
  <!-- White: center, main -->
  <text x="16" y="25" font-family="system-ui,-apple-system,'Helvetica Neue',sans-serif"
        font-weight="900" font-size="22" fill="none" stroke="#ffffff" stroke-width="2"
        text-anchor="middle">S</text>
</svg>
